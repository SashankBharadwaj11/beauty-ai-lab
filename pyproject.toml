[project]
name = "bcia"
version = "0.1.0"
description = "Beauty Campaign Intelligence Assistant - fictional training lab (synthetic data only)"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=7"]
pdf = ["pymupdf>=1.24", "cmudict>=1.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
